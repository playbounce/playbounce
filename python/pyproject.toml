[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "playbounce"
version = "1.0.0"
description = "A brick-breaker game where the wall fights back."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mo Shehu" }]
keywords = ["game", "browser", "canvas", "brick-breaker", "arcade"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment :: Arcade",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/playbounce/playbounce"
Documentation = "https://github.com/playbounce/playbounce/blob/main/USAGE.md"
Changelog = "https://github.com/playbounce/playbounce/blob/main/CHANGELOG.md"
Source = "https://github.com/playbounce/playbounce"

[project.scripts]
playbounce = "playbounce.cli:main"

[project.optional-dependencies]
test = ["pytest>=7"]

# The game itself is the repository's web/ directory, one level up. The build
# hook copies it in so the wheel and the sdist both carry a playable copy
# rather than the package pointing at files that only exist in a checkout.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/playbounce"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "hatch_build.py", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
