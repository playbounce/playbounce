name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Declaring any permissions block drops every scope left out to none, so
# contents: read is named explicitly even though it used to be a default.
permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'

      - name: Check every script parses
        run: |
          for file in web/*.js tools/*.js; do
            node --check "$file"
          done

      - name: Check the font and the cast
        run: |
          node -e "
          const fs = require('fs');
          const g = { PB: {} };
          new Function('window', fs.readFileSync('web/bricks.js', 'utf8'))(g);
          new Function('window', fs.readFileSync('web/names.js', 'utf8'))(g);

          let bad = 0;
          for (let i = 65; i <= 90; i += 1) {
            const w = g.PB.bricks.buildWall(String.fromCharCode(i));
            if (w.cols !== 5 || w.rows !== 7 || w.cells.length !== 35 || w.live === 0) bad += 1;
          }
          if (bad) throw new Error(bad + ' glyphs are not a filled 5x7 grid');

          const cast = g.PB.names.cast;
          if (cast.length === 0) throw new Error('the cast is empty');
          const undrawable = cast.filter(n => !/^[A-Z]{1,8}\$/.test(n));
          if (undrawable.length) throw new Error('undrawable names: ' + undrawable.join(', '));

          const failed = cast.filter(n => {
            const w = g.PB.bricks.buildWall(n);
            return w.name !== n || w.cols !== n.length * 6 - 1 || w.live === 0;
          });
          if (failed.length) throw new Error('names that build a broken wall: ' + failed.join(', '));

          console.log('26 glyphs valid, ' + cast.length + ' names build valid walls');
          "

      - name: Play a batch of games headlessly
        run: node tools/simulate.js --runs 20 --skill 0.7

  python:
    name: python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package and its test extra
        run: python -m pip install --upgrade pip './python[test]'

      - name: Run the tests
        working-directory: python
        run: python -m pytest -q

      # The game is copied into the package at build time, so a wheel that
      # builds without error can still ship without a playable game in it.
      - name: Check the built wheel carries the game
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist python
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path('dist').glob('*.whl'))
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {'playbounce/py.typed', 'playbounce/web/index.html'}
          required |= {
              f'playbounce/web/{f}' for f in (
                  'trace.js', 'bricks.js', 'names.js', 'taunts.js', 'audio.js',
                  'powerups.js', 'beast.js', 'game.js', 'ui.js', 'style.css',
              )
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f'{wheel.name} is missing: {missing}')
          print(f'{wheel.name} carries {len(required)} required files')
          PY

      - name: Check the version agrees across surfaces
        run: |
          python - <<'PY'
          import pathlib, re, sys
          init = pathlib.Path('python/src/playbounce/__init__.py').read_text()
          toml = pathlib.Path('python/pyproject.toml').read_text()
          code = re.search(r'__version__ = "([^"]+)"', init).group(1)
          meta = re.search(r'^version = "([^"]+)"', toml, re.M).group(1)
          if code != meta:
              sys.exit(f'__init__.py says {code}, pyproject.toml says {meta}')
          print(f'version {code} agrees across both surfaces')
          PY
